# ============================================================
#  MythicPassiveSkills
# ============================================================
#  Файлы пассивных навыков лежат в:
#    plugins/MythicMobs/PassiveSkills/*.yml
#
#  Плагин не требует перезапуска сервера: /passive reload
#  перечитывает профили, а /mm reload — ещё и скиллы MythicMobs.
# ============================================================

settings:
  # Как часто (в тиках) перепроверять permission-ноды игроков.
  # 20 тиков = 1 секунда. 0 — отключить периодическую проверку.
  # При установленном LuckPerms права обновляются мгновенно через события,
  # но периодическая проверка всё равно полезна для других плагинов прав.
  permission-refresh-ticks: 40

  # Проверять permission перед каждым срабатыванием interval-пассивки.
  recheck-permission-each-tick: true

  # Подробные сообщения в консоль (какие скиллы и когда выполняются).
  debug: false

# ============================================================
#  Совместимость с MythicCrucible и кликами по предметам
# ============================================================
#  Один клик хотят обработать сразу несколько плагинов:
#    * MythicCrucible  — onLeftClick / onUse / onPressF предмета;
#    * MythicMobs      — onUse предмета (запускается на правый клик);
#    * этот аддон      — триггеры пассивок.
#  Правила ниже решают, кто получает клик. По умолчанию клик
#  всегда остаётся за предметом MythicCrucible, а пассивки
#  только слушают событие и не отменяют его чужим отменённым
#  слушателем на LOWEST, как было раньше.
passive-routing:
  # Пассивки получают клики предметов вместе с MythicCrucible.
  #   true  - предмет MythicCrucible и пассивка работают параллельно;
  #   false - если у предмета есть скилл на этот клик, пассивка его не дублирует.
  # Применяется после /passive reload (или перезапуска сервера).
  item-triggers: true

  # Наш правый клик у предмета с onUse: отменяем клик, чтобы MythicMobs
  # запустил onUse предмета один раз (а не дважды нажатием ПКМ).
  item-use-click: true

  # Отменять эффект свапа рук, если предмет в руке НЕ объявляет onPressF:
  # для игрока F - кнопка способности, а не смена рук.
  # Если onPressF у предмета есть, событие остаётся нетронутым.
  cancel-swap-hands: true

  # Не давать MythicCrucible запустить способность предмета повторно
  # через onUse при выполнении нашей пассивки (подмена itemname в контексте).
  resolve-item-use-loop: true

  # Как часто (в тиках) перечитывать предметы MythicMobs/MythicCrucible
  # и их триггеры. 200 тиков = 10 секунд. 0 - только после /mm reload.
  refresh-ticks: 200
